<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Currículum — Juan Pérez</title>
  <meta name="description" content="CV moderno y elegante — Juan Pérez" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="cv-container" id="cv">
    <aside class="sidebar">
      <div class="controls">
        <button id="themeToggle" title="Cambiar tema">🌗</button>
        <button id="printBtn" title="Imprimir/Guardar PDF">⬇️ PDF</button>
      </div>
      <div class="photo" aria-hidden="true">
        <img id="photo" src="" alt="Foto de perfil">
      </div>
      <h1 class="name" id="name">Nombre Apellido</h1>
      <p class="title" id="title">Profesión / Rol</p>

      <section class="contact">
        <h2>Contacto</h2>
        <ul id="contactList"></ul>
      </section>

      <section class="skills">
        <h2>Habilidades</h2>
        <ul class="skill-list" id="skillsList"></ul>
      </section>

      <section class="languages">
        <h2>Idiomas</h2>
        <ul id="languagesList"></ul>
      </section>
    </aside>

    <section class="main">
      <header class="summary">
        <h2>Resumen</h2>
        <p id="summary">Breve descripción profesional.</p>
      </header>

      <section class="experience">
        <h2>Experiencia</h2>
        <div id="experienceList"></div>
      </section>

      <section class="projects">
        <h2>Proyectos destacados</h2>
        <ul id="projectsList"></ul>
      </section>

      <section class="education">
        <h2>Formación</h2>
        <div id="education"></div>
      </section>

      <footer class="download">
        <p>Usa el botón "⬇️ PDF" o imprime desde el navegador (Ctrl/Cmd+P).</p>
      </footer>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
